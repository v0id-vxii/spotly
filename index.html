<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotly — Effortless Local Store &amp; Restaurant Discovery</title>
    <meta
      name="description"
      content="Effortless local store and restaurant discovery with personalized recommendations, interactive maps, and featured neighborhood perks."
    />
    <meta property="og:title" content="Spotly — Effortless Local Store &amp; Restaurant Discovery" />
    <meta
      property="og:description"
      content="Effortless local store and restaurant discovery with personalized recommendations, interactive maps, and featured neighborhood perks."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('spotly_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved !== 'light' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
          if (localStorage.getItem('spotly_easy_read') === 'true') {
            document.documentElement.classList.add('easy-read');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
